[project]
name = "agentrl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "torch>=2.4",
    "transformers>=4.56.2",
    "peft>=0.13.0",
    "trl>=0.13.0",
    "accelerate>=1.4.0",
    "datasets>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
