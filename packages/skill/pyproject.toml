[project]
name = "opentalos-skill"
version = "0.1.0"
description = "OpenTalos skill discovery + sandboxed script execution service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "docker>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# 这是一个直接跑的服务，不是要发布的库——不需要 uv 把它构建/安装成一个 wheel，只需要在共享的
# workspace venv 里装好依赖。
[tool.uv]
package = false
