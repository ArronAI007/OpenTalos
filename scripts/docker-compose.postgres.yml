# The ONE local Postgres instance used for regular development (scripts/dev.sh postgres:up,
# .env's DATABASE_URL). Deliberately a separate compose project/port from
# apps/web/e2e/docker-compose.yml — that one's data is destroyed and reseeded on every Playwright
# run (see apps/web/e2e/global-setup.ts's DROP TABLE / reseed), so it must never be the same
# database a developer is also using for manual testing via the admin/web UIs.
name: opentalos-dev
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
