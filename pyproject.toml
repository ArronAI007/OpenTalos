[project]
name = "opentalos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.54",
    "anthropic>=0.39",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "tiktoken>=0.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "mcp>=2.3.0",
    "a2a-sdk>=1.2.2",
    "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false
# cryptography >=49 起不再发布 macOS x86_64 / universal2 wheel（只剩 arm64）。在 Intel mac 上
# 会退化为源码编译（需要 Rust），uv 会自动联网装 Rust，导致 `uv sync` 长时间卡住/失败。
# 约束到仍提供 universal2（含 x86_64）预编译 wheel 的版本，各平台都走二进制安装。
override-dependencies = ["cryptography<49"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# packages/ 加进 sys.path 的逻辑在 tests/conftest.py 里（pytest 的 pythonpath ini 选项实测在这个
# 仓库装的 pytest 版本上不生效）。
