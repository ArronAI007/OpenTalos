[project]
name = "opentalos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.54",
    "anthropic>=0.39",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "docker>=7.1",
    "tiktoken>=0.8",
    "gradio>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# packages/ 加进 sys.path 的逻辑在 tests/conftest.py 里（pytest 的 pythonpath ini 选项实测在这个
# 仓库装的 pytest 版本上不生效）。
