[project]
name = "opentalos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.54",
    "anthropic>=0.39",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "tiktoken>=0.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "a2a-sdk>=1.2.2",
    "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # 官方 mcp PyPI 包：packages/mcp 自己的生产代码不再依赖它（SC-001）；demo_server.py 是
    # 测试夹具，扮演被连接的 MCP *server* 角色，继续用官方 SDK 实现，所以这里保留为测试依赖。
    # 注意：packages/mcp 这个目录名和这个 PyPI 包同名——packages/ 只在 apps/api 主进程/pytest
    # 里被 prepend 进 sys.path，demo_server.py 永远作为独立子进程启动（不继承那次 sys.path
    # 插入），所以 import mcp 不会被本仓库自己的 packages/mcp 遮蔽；但若将来有代码在同一个
    # 进程里直接 `import mcp`（而不是 `from mcp.client import ...` 这种本包内部写法），会命中
    # 这次目录重命名带来的遮蔽风险，新增这类 import 前需要重新确认。
    "mcp>=2.3.0",
]

[tool.uv]
package = false
# cryptography >=49 起不再发布 macOS x86_64 / universal2 wheel（只剩 arm64）。在 Intel mac 上
# 会退化为源码编译（需要 Rust），uv 会自动联网装 Rust，导致 `uv sync` 长时间卡住/失败。
# 约束到仍提供 universal2（含 x86_64）预编译 wheel 的版本，各平台都走二进制安装。
override-dependencies = ["cryptography<49"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# packages/ 加进 sys.path 的逻辑在 tests/conftest.py 里（pytest 的 pythonpath ini 选项实测在这个
# 仓库装的 pytest 版本上不生效）。
